name: diag
on: [push]
permissions:
  contents: write
jobs:
  diag:
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev,openai,anthropic,mcp]" pyyaml mypy
      - name: full raw capture
        run: |
          set +e
          python -m pytest tests -q > /tmp/o.txt 2>&1
          EC=$?
          F="CI_DIAG_${{ matrix.python }}.txt"
          echo "PYTHON=${{ matrix.python }} EXITCODE=$EC" > $F
          echo "=== LAST 60 LINES RAW ===" >> $F
          tail -60 /tmp/o.txt >> $F
          git config user.name ci-diag
          git config user.email ci@example.com
          git pull --rebase origin skillloop-improvements || true
          git add -f $F
          git commit -m "diag ${{ matrix.python }}" || true
          for i in 1 2 3 4 5; do git pull --rebase origin skillloop-improvements && git push origin HEAD:skillloop-improvements && break || sleep 5; done
          exit 0
