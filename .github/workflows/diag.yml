name: diag
on: [push]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,openai,anthropic,mcp]" pyyaml
      - name: pytest with summary
        run: |
          set +e
          python -m pytest tests -q > out.txt 2>&1
          echo "EXIT=$?" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(FAILED|ERROR)" out.txt | head -40 >> $GITHUB_STEP_SUMMARY
          tail -5 out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Tracebacks" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 25 "=== FAILURES ===" out.txt | head -80 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 0
