name: diag
on: [push]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,openai,anthropic,mcp]" pyyaml
      - name: run tests and commit output
        run: |
          set +e
          python -m pytest tests -q > /tmp/out.txt 2>&1
          echo "EXITCODE=$?" > CI_DIAG.txt
          echo "=== SUMMARY LINE ===" >> CI_DIAG.txt
          tail -3 /tmp/out.txt >> CI_DIAG.txt
          echo "=== FAILED/ERROR LIST ===" >> CI_DIAG.txt
          grep -E "^(FAILED|ERROR)" /tmp/out.txt >> CI_DIAG.txt
          echo "=== FIRST 200 LINES OF FAILURES ===" >> CI_DIAG.txt
          sed -n '/=== FAILURES ===/,$p' /tmp/out.txt | head -200 >> CI_DIAG.txt
          git config user.name ci-diag
          git config user.email ci@example.com
          git add -f CI_DIAG.txt
          git commit -m "ci diag output" || true
          git push origin HEAD:skillloop-improvements || true
          exit 0
